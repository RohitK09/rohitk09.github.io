# Co-author profiles used for multi-author posts.
# To attribute a post to a co-author, add `author: AuthorName` in the post's front matter.
# Example entry:
#
# Jane Doe:
#   name        : "Jane Doe"
#   uri         : "https://janedoe.com"
#   email       : "jane@example.com"
#   bio         : "Brief bio for Jane."
#   avatar      : "jane-photo.jpg"   # place image in /images/
#   twitter     : "janedoe"
